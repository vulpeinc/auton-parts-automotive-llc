<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0" stop-color="#22395a" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#0f1b2d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0a1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f19a42"/>
      <stop offset="1" stop-color="#c96f17"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a1220"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Planetary gear set (abstract) -->
  <g transform="translate(1150 430)">
    <!-- ring gear -->
    <circle r="300" fill="none" stroke="#2b4466" stroke-width="2"/>
    <circle r="270" fill="none" stroke="#22395a" stroke-width="22" stroke-dasharray="14 10"/>
    <circle r="250" fill="none" stroke="#2b4466" stroke-width="1.5"/>
    <!-- sun gear -->
    <circle r="70" fill="#16263d" stroke="url(#amber)" stroke-width="3"/>
    <circle r="70" fill="none" stroke="#e8892b" stroke-opacity=".5" stroke-width="14" stroke-dasharray="9 7"/>
    <circle r="26" fill="#0a1220" stroke="#e8892b" stroke-width="3"/>
    <!-- planet carrier -->
    <circle r="160" fill="none" stroke="#e8892b" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 8"/>
    <g fill="#13223a" stroke="#3a5579" stroke-width="2">
      <circle cx="0" cy="-160" r="78"/>
      <circle cx="138.6" cy="80" r="78"/>
      <circle cx="-138.6" cy="80" r="78"/>
    </g>
    <g fill="none" stroke="#5b7699" stroke-opacity=".6" stroke-width="12" stroke-dasharray="8 7">
      <circle cx="0" cy="-160" r="72"/>
      <circle cx="138.6" cy="80" r="72"/>
      <circle cx="-138.6" cy="80" r="72"/>
    </g>
    <g fill="#0a1220" stroke="#e8892b" stroke-width="2.5">
      <circle cx="0" cy="-160" r="16"/>
      <circle cx="138.6" cy="80" r="16"/>
      <circle cx="-138.6" cy="80" r="16"/>
    </g>
  </g>

  <!-- secondary gear -->
  <g transform="translate(1480 820)">
    <circle r="150" fill="none" stroke="#22395a" stroke-width="18" stroke-dasharray="12 9"/>
    <circle r="110" fill="none" stroke="#2b4466" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#e8892b" stroke-opacity=".6" stroke-width="3"/>
  </g>

  <!-- flow lines (fluid) -->
  <g fill="none" stroke-linecap="round">
    <path d="M620 760 C 820 700, 900 820, 1100 770 S 1400 700, 1600 740" stroke="#e8892b" stroke-opacity=".35" stroke-width="2"/>
    <path d="M560 800 C 780 740, 900 860, 1120 810 S 1420 740, 1600 790" stroke="#5b7699" stroke-opacity=".3" stroke-width="2"/>
    <path d="M700 120 C 860 160, 940 60, 1120 100 S 1420 170, 1600 120" stroke="#5b7699" stroke-opacity=".22" stroke-width="2"/>
  </g>
  <g fill="#e8892b">
    <circle cx="1100" cy="770" r="4"/>
    <circle cx="1400" cy="716" r="3" fill-opacity=".7"/>
    <circle cx="860" cy="732" r="3" fill-opacity=".6"/>
  </g>
</svg>
