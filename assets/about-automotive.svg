<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263d"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f19a42"/>
      <stop offset="1" stop-color="#c96f17"/>
    </linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <!-- shelving / inventory racks -->
  <g stroke="#3a5579" stroke-width="3" fill="none">
    <path d="M90 140V500M330 140V500"/>
    <path d="M90 230H330M90 330H330M90 430H330"/>
  </g>
  <g>
    <rect x="110" y="170" width="60" height="52" rx="6" fill="#22395a"/>
    <rect x="182" y="182" width="48" height="40" rx="6" fill="#2b4466"/>
    <rect x="242" y="164" width="68" height="58" rx="6" fill="url(#am)" opacity=".9"/>
    <rect x="110" y="268" width="80" height="54" rx="6" fill="#2b4466"/>
    <rect x="202" y="278" width="52" height="44" rx="6" fill="#22395a"/>
    <rect x="266" y="270" width="44" height="52" rx="6" fill="#3a5579"/>
    <rect x="110" y="372" width="54" height="50" rx="6" fill="#22395a"/>
    <rect x="176" y="364" width="64" height="58" rx="6" fill="#3a5579"/>
    <rect x="252" y="378" width="58" height="44" rx="6" fill="#2b4466"/>
  </g>

  <!-- fluid bottle silhouettes -->
  <g transform="translate(400 250)">
    <path d="M30 0h40v26l18 22v152a14 14 0 0 1-14 14H26a14 14 0 0 1-14-14V48l18-22z" fill="#22395a" stroke="#5b7699" stroke-width="2"/>
    <rect x="26" y="96" width="48" height="60" rx="6" fill="url(#am)" opacity=".85"/>
    <path d="M140 30h34v22l14 18v130a12 12 0 0 1-12 12h-38a12 12 0 0 1-12-12V70l14-18z" fill="#1c3050" stroke="#5b7699" stroke-width="2"/>
    <rect x="136" y="110" width="42" height="46" rx="5" fill="#5b7699" opacity=".7"/>
  </g>

  <!-- filter / gasket rings -->
  <g transform="translate(640 230)">
    <circle r="70" fill="none" stroke="url(#am)" stroke-width="10"/>
    <circle r="50" fill="none" stroke="#5b7699" stroke-width="2" stroke-dasharray="6 6"/>
    <circle r="22" fill="#0a1220" stroke="#3a5579" stroke-width="3"/>
  </g>
  <g transform="translate(650 430)">
    <rect x="-70" y="-46" width="140" height="92" rx="14" fill="none" stroke="#3a5579" stroke-width="8"/>
    <rect x="-46" y="-24" width="92" height="48" rx="8" fill="none" stroke="#5b7699" stroke-width="2"/>
    <g fill="#e8892b"><circle cx="-56" cy="-32" r="5"/><circle cx="56" cy="-32" r="5"/><circle cx="-56" cy="32" r="5"/><circle cx="56" cy="32" r="5"/></g>
  </g>

  <path d="M60 530H740" stroke="#2b4466" stroke-width="2"/>
</svg>
